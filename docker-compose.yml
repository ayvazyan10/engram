version: '3.9'

services:
  # PostgreSQL — NOT usable as an Engram primary backend. Engram's core
  # engine is SQLite-only; setting ENGRAM_DATABASE=postgresql fails fast by
  # design. This service is kept for cloud sync testing (ENGRAM_SYNC_URL —
  # see docs/CLOUD-SYNC.md), not as a primary backend; the api service below
  # always uses SQLite.
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      # Bound to loopback. '5432:5432' published a database whose password is
      # written three lines below on every interface of the host — on a laptop
      # on a cafe network, that is an open database. Change the left-hand side
      # to 0.0.0.0 only after setting POSTGRES_PASSWORD to something real.
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_DB: engram
      POSTGRES_USER: engram
      # Override with POSTGRES_PASSWORD in the environment or a .env file. The
      # default stays weak on purpose — it is only reachable from this host.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U engram']
      interval: 5s
      timeout: 5s
      retries: 5

  # Engram REST API
  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      # Bound to loopback. '4901:4901' published an API with no authentication
      # on every interface of the host: anyone on the same network could read,
      # write and delete every memory. To expose it deliberately, set
      # ENGRAM_API_KEY below, add the public hostname to ENGRAM_ALLOWED_HOSTS,
      # and then change this to '0.0.0.0:4901:4901'.
      - '127.0.0.1:4901:4901'
    environment:
      ENGRAM_DB_PATH: /data/engram.db
      NODE_ENV: production
      # Hostnames this API may be addressed by (DNS-rebinding defense). IP
      # literals and localhost are always allowed; 'api' is the name the web
      # container's proxy uses. Add your own hostname here when putting this
      # behind a reverse proxy, or set '*' to turn the check off.
      ENGRAM_ALLOWED_HOSTS: localhost,127.0.0.1,api
      # Shared secret for the REST API and the WebSocket handshake. Deliberately
      # NOT templated as ${ENGRAM_API_KEY}: an unset variable would expand to an
      # empty string, which the server now refuses to start with rather than
      # running unauthenticated. Uncomment and set a real value to enable auth.
      # ENGRAM_API_KEY: change-me
    volumes:
      - api_data:/data
    # No depends_on postgres: this service always runs on SQLite
    # (ENGRAM_DB_PATH only). The postgres service above is for cloud sync
    # testing (ENGRAM_SYNC_URL), not an alternate primary backend.
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:4901/api/health']
      interval: 10s
      timeout: 5s
      retries: 3

  # Engram Web Dashboard
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      # Loopback for the same reason as the API: the dashboard is the UI onto
      # that same unauthenticated data.
      - '127.0.0.1:4902:80'
    depends_on:
      - api

  # Ollama (optional — for local LLM with memory)
  # Uncomment to enable:
  # ollama:
  #   image: ollama/ollama:latest
  #   ports:
  #     - '11434:11434'
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]

volumes:
  postgres_data:
  api_data:
  # ollama_data:
