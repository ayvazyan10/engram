<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Engram</title>
    <meta name="description" content="Engram: the map of what your AI remembers" />
    <!--
      Archivo is self-hosted (src/styles/fonts.css): this dashboard is served
      by the Engram process on the owner's machine, often offline. Only the
      upright file is preloaded; it carries nearly every first-paint glyph.
      `crossorigin` is required on a font preload even when same-origin.
    -->
    <link rel="preload" href="/fonts/archivo-latin-wght-wdth.woff2" as="font" type="font/woff2" crossorigin />
    <!--
      The reader's colour mode is applied before the first paint
      (public/theme-init.js, blocking on purpose; it is a few bytes).
    -->
    <script src="/theme-init.js"></script>
    <style>
      html, body, #root { background: #EAF0EC; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]), html:not([data-theme="light"]) body, html:not([data-theme="light"]) #root { background: #0F1A1C; }
      }
      html[data-theme="dark"], html[data-theme="dark"] body, html[data-theme="dark"] #root { background: #0F1A1C; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
