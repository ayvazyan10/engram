<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Engram — AI Brain Visualization</title>
    <meta name="description" content="Universal AI Brain — visualize and interact with persistent memory" />
    <!--
      Inter was previously named in the font-family stack (index.html, old
      version) but never actually loaded, so the browser always fell through
      to the system UI font — a typeface implied but absent. Loaded properly
      here: preconnect to both Google Fonts hosts, then the stylesheet with
      display=swap so text still paints in the fallback stack immediately and
      swaps once Inter arrives, matching the font-loading rule (max two
      families, swap, preload only the weights actually used).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <!-- Pre-paint background so there's no flash-of-white before global.css
         (imported from main.tsx) finishes loading. -->
    <style>
      html, body, #root { background: #020817; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
