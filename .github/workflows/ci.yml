name: CI

on:
  push:
    # '**', not '*': a single star stops at a slash, so every namespaced branch
    # (fix/…, agent/…) pushed without CI, and the pull_request trigger below
    # named a branch this repo does not have. Between them, PR #4 merged with
    # no checks at all.
    branches: ['**']
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.x']

    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.15.4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Cache Xenova embedding model
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: xenova-all-MiniLM-L6-v2-v1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Build
        run: pnpm turbo run build

      - name: Generate & apply DB migrations
        run: |
          pnpm db:generate
          pnpm db:migrate
        env:
          ENGRAM_DB_PATH: /tmp/engram-test.db

      - name: Test
        run: pnpm turbo run test
        env:
          ENGRAM_DB_PATH: /tmp/engram-test.db

      # The Desktop Extension manifest has its own schema — an unsupported key
      # only surfaces at pack time, which is during a release otherwise.
      - name: Validate Desktop Extension manifest
        run: npx --yes @anthropic-ai/mcpb validate packages/mcpb/manifest.json
