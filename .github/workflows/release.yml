name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual runs never publish. They exercise the whole pipeline — npm
  # credentials, build, package names, bundle validation — so a broken release
  # is found before a tag is cut rather than after.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      # v0.4.0 failed here: the secret was gone, so setup-node wrote an .npmrc
      # with an empty _authToken and npm only said ENEEDAUTH after a full build,
      # from inside the publish loop. An absent secret is caught in seconds now.
      #
      # The identity probe is reported, never asserted. `npm whoami` answers for
      # a classic token but a granular access token gets 403 from /-/whoami
      # while still being able to publish, so a hard check there would reject a
      # working token. Nothing short of publishing proves write access, so the
      # step must not imply it did — the first version of this check ran whoami
      # inside a command substitution, where `set -e` ignores the exit code, and
      # printed a confident "Authenticated to npm as " with a blank name.
      - name: Verify npm credentials
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN repository secret is unset or empty. Add one with: gh secret set NPM_TOKEN"
            exit 1
          fi

          if user=$(npm whoami 2>/dev/null); then
            echo "npm token belongs to ${user}"
          else
            echo "npm token is set; /-/whoami refused it, which is expected for a granular access token"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build

      # Publishing by directory (not by --filter) so a renamed package can never
      # silently match zero projects and let the release pass while shipping nothing.
      - name: Verify package names
        run: |
          set -euo pipefail
          for dir in packages/core packages/mcp packages/cli packages/vis; do
            name=$(node -p "require('./$dir/package.json').name")
            case "$name" in
              @engram-ai-memory/*) echo "ok: $name ($dir)" ;;
              *) echo "::error::unexpected package name '$name' in $dir"; exit 1 ;;
            esac
          done

      - name: Publish packages
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          for dir in packages/core packages/mcp packages/cli packages/vis; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")

            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "Skipping $name@$version (already published)"
              continue
            fi

            echo "Publishing $name@$version from $dir..."
            (cd "$dir" && pnpm publish --access public --no-git-checks)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The .mcpb bundle is how Claude Desktop users install Engram, so it is
      # built and validated on every run and attached to the release below.
      - name: Build Claude Desktop bundle
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/mcpb
          pnpm pack:mcpb

      - name: Create GitHub release
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes="$(python3 .github/scripts/changelog-section.py "${tag#v}")"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists — updating notes and asset"
            printf '%s' "$notes" | gh release edit "$tag" --notes-file -
            gh release upload "$tag" packages/mcpb/engram-mcp.mcpb --clobber
          else
            printf '%s' "$notes" | gh release create "$tag" \
              --title "$tag" --notes-file - \
              packages/mcpb/engram-mcp.mcpb
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
