name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build

      # Publishing by directory (not by --filter) so a renamed package can never
      # silently match zero projects and let the release pass while shipping nothing.
      - name: Verify package names
        run: |
          set -euo pipefail
          for dir in packages/core packages/mcp packages/cli packages/vis; do
            name=$(node -p "require('./$dir/package.json').name")
            case "$name" in
              @engram-ai-memory/*) echo "ok: $name ($dir)" ;;
              *) echo "::error::unexpected package name '$name' in $dir"; exit 1 ;;
            esac
          done

      - name: Publish packages
        run: |
          set -euo pipefail
          for dir in packages/core packages/mcp packages/cli packages/vis; do
            echo "Publishing $dir..."
            (cd "$dir" && pnpm publish --access public --no-git-checks)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
